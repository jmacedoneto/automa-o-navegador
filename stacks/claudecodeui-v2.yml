version: '3.8'

services:
  claudecodeui:
    image: ${CLAUDECODEUI_IMAGE:-claudecodeui:latest}
    command: >-
      sh -c '
      if [ -f /workspaces/.claude-patches/claude-sdk.js ]; then
        cp /workspaces/.claude-patches/claude-sdk.js /usr/local/lib/node_modules/@siteboon/claude-code-ui/server/claude-sdk.js &&
        echo "[PATCH] Applied claude-sdk.js patch";
      fi &&
      if [ -f /workspaces/.claude-patches/claude-wrapper.sh ]; then
        rm -f /usr/local/bin/claude &&
        cp /workspaces/.claude-patches/claude-wrapper.sh /usr/local/bin/claude &&
        chmod +x /usr/local/bin/claude &&
        echo "[PATCH] Applied claude wrapper";
      fi &&
      node /workspaces/.workspace-watcher.js &
      exec cloudcli'
    environment:
      AUTH_TOKEN: ${AUTH_TOKEN:-Macedo020589#}
      PORT: ${PORT:-3001}
      HOST: 0.0.0.0
      WORKSPACES_ROOT: /workspaces
      JWT_SECRET: ${JWT_SECRET:-48b1adfbd9a70cc3d1bd8f2d692c569fbd7ef62f50922c21b1164bda0b209c86}
      DATABASE_PATH: /workspaces/.cloudcli/auth.db
      DEFAULT_MODEL: ${DEFAULT_MODEL:-gpt-5.4-mini}
      STACK_RELEASE: ${STACK_RELEASE:-2026-03-23-v2}
    volumes:
      - /root/.claude:/root/.claude
      - /root:/workspaces
      - /root/.codex:/root/.codex
      - /root/.claude.json:/root/.claude.json
    networks:
      - Deltanet
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      update_config:
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: any
      labels:
        - traefik.enable=true
        - traefik.http.routers.claudecodeui-v2.rule=Host(`${APP_HOST:-claudecodeui-v2.apvsiguatemi.net}`)
        - traefik.http.routers.claudecodeui-v2.entrypoints=websecure
        - traefik.http.routers.claudecodeui-v2.tls.certresolver=letsencryptresolver
        - traefik.http.services.claudecodeui-v2.loadbalancer.server.port=3001
        - traefik.http.services.claudecodeui-v2.loadbalancer.passHostHeader=true

networks:
  Deltanet:
    external: true
